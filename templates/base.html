<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>
      {% block title %}{% endblock %} - {{ config_projeto.nome_empresa }}
    </title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    {% if config_projeto.favicon %}
    <link rel="icon" href="{{ config_projeto.favicon.url }}" />
    {% endif %}
    <style>
      .sidebar {
        height: 100vh;
        width: 250px;
        position: fixed;
        background: #212529;
        color: white;
        padding-top: 20px;
      }
      .sidebar a {
        padding: 15px;
        text-decoration: none;
        color: #adb5bd;
        display: block;
      }
      .sidebar a:hover {
        background: #343a40;
        color: white;
      }
      .main-content {
        margin-left: 250px;
        padding: 20px;
        background-color: #f8f9fa;
        min-height: 100vh;
      }
      .card {
        border: none;
        box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
      }
    </style>
  </head>
  <body>
    <div class="sidebar shadow">
      <div class="text-center mb-4">
        {% if config_projeto.logo %}
        <img
          src="{{ config_projeto.logo.url }}"
          width="80"
          class="rounded-circle mb-2 border border-secondary"
        />
        {% endif %}
        <h6 class="text-white px-2">{{ config_projeto.nome_empresa }}</h6>
      </div>
      <a href="{% url 'home' %}"
        ><i class="fa-solid fa-chart-line me-2"></i> Dashboard</a
      >
      <a href="{% url 'lista_clientes' %}"
        ><i class="fa-solid fa-users me-2"></i> Clientes</a
      >
      <a href="{% url 'lista_ordens' %}"
        ><i class="fa-solid fa-file-invoice-dollar me-2"></i> Ordens de
        Serviço</a
      >
      <a href="{% url 'setor_arte' %}"
        ><i class="fa-solid fa-palette me-2"></i> Setor de Arte</a
      >
      <a href="#"><i class="fa-solid fa-wallet me-2"></i> Financeiro</a>
      <a href="/admin" target="_blank"
        ><i class="fa-solid fa-gear me-2"></i> Painel Admin</a
      >
      <a href="{% url 'logout' %}" class="text-danger mt-5"
        ><i class="fa-solid fa-right-from-bracket me-2"></i> Sair</a
      >
    </div>

    <div class="main-content">{% block content %} {% endblock %}</div>
  </body>
</html>
